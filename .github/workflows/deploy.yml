name: Automation Platform CI

on:
  push:
    branches:
      - main

env:
  ECR_REGISTRY: 251522454642.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: automation-platform
  AWS_REGION: ap-south-1

jobs:
  set-variables:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-output.outputs.tag }}
    steps:
      - name: Set image tag
        id: set-output
        run: |
          BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
          TAG="${BRANCH}-${{ github.sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag will be: $TAG"
  build:
    needs: set-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login --username AWS \
          --password-stdin $ECR_REGISTRY

      - name: Build Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$IMAGE_NAME:${{ needs.set-variables.outputs.tag }} \
            -f docker/Dockerfile .

      - name: Push to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$IMAGE_NAME:${{ needs.set-variables.outputs.tag }}
  trivy-scan:
      runs-on: ubuntu-latest
      needs: [set-variables, build]
      steps:
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ap-south-1

        - name: Trivy Image Scan
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: '${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.set-variables.outputs.tag }}'
            format: 'table'
            severity: 'CRITICAL,HIGH'
  checkov-scan:
    runs-on: ubuntu-latest
    needs: [set-variables, build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
  secret-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [set-variables, build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Tests
        run: |
          pytest app/tests --junitxml=reports/test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test-results.xml

  helm-update:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: [set-variables, sonarqube, trivy-scan, checkov-scan, secret-scan, unit-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update Helm Chart
        run: |
          git checkout main
          git pull origin main --rebase
          sed -i "s/tag:.*/tag: ${{ needs.set-variables.outputs.tag }}/" \
            helm/automation-platform-chart/values.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add helm/automation-platform-chart/values.yaml
          git commit -m "Update image tag to ${{ needs.set-variables.outputs.tag }}" || true
          git push origin main

